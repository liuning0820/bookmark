name: Deploy MkDocs site to GitHub Pages

on:
  # Rebuild and deploy on every push to the default branch
  push:
    branches:
      - master
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  # gh-deploy needs to push the built site to the gh-pages branch
  contents: write

# Avoid overlapping deploys; cancel an in-progress run when a newer push arrives
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is needed by the git-revision-date plugin
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force --clean
